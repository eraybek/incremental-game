<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#080c1a" />
    <title>Magnet Incremental</title>
    <link rel="icon" href="./assets/magnet/magnet.png" />
  </head>
  <body>
    <!-- Portrait column: full width on a phone, letterboxed on a desktop window.
         The bars sit outside the arena so the HUD can never cover the playfield. -->
    <div id="app">
      <div id="topbar" class="gamebar"></div>
      <div id="canvas-wrap">
        <canvas id="game-canvas"></canvas>
      </div>
      <div id="bottombar" class="gamebar"></div>
      <div id="ui-root"></div>
    </div>
    <div id="rotate-hint">
      <div class="phone"></div>
      <p>Telefonu dik tut</p>
      <small>Magnet Incremental dikey ekran için tasarlandı.</small>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
