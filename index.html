<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#04121f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Derin Sular</title>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="scene"></canvas>
        <div id="floats"></div>

        <div id="topbar">
          <div class="stat stat-money">
            <span class="stat-label">Para</span>
            <span class="stat-value" id="money">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Gelir</span>
            <span class="stat-value" id="rate">0/sn</span>
          </div>
          <div class="stat">
            <span class="stat-label" id="zone-label">Sığlık</span>
            <span class="stat-value" id="depth">0 m</span>
          </div>
        </div>

        <!-- Tempo (seri) carpani; aktif oynadikca dolar, birakinca 1'e doner -->
        <div id="combo-pill" hidden>
          <span id="combo-val">×1.0</span>
          <span class="combo-label">tempo</span>
        </div>

        <!-- Paneli acan dugme; satin alinabilir bir sey varsa uzerinde nokta belirir -->
        <button id="panel-open" type="button" aria-label="Teçhizat panelini aç">
          <span class="panel-open-icon"></span>
          <span class="panel-dot" id="panel-dot" hidden></span>
        </button>

        <div id="toasts"></div>
      </div>

      <div id="scrim" hidden></div>

      <aside id="panel" class="is-closed" aria-hidden="true">
        <div id="panel-head">
          <div id="tabs">
            <button class="tab is-active" data-tab="gear" type="button">Teçhizat</button>
            <button class="tab" data-tab="book" type="button">Defter</button>
            <button class="tab" data-tab="clean" type="button">Temiz Deniz</button>
          </div>
          <button id="panel-close" type="button" aria-label="Paneli kapat">✕</button>
        </div>
        <div class="tab-body is-active" id="tab-gear"></div>
        <div class="tab-body" id="tab-book"></div>
        <div class="tab-body" id="tab-clean"></div>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
