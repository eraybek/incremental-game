<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#04121f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Derin Sular</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <!-- Sahne uzerine binen bilgi katmani (tiklamayi gecirir) -->
      <div id="overlay">
        <div id="topbar">
          <div class="stat stat-money">
            <span class="stat-label">Para</span>
            <span class="stat-value" id="money">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Gelir</span>
            <span class="stat-value" id="rate">0/sn</span>
          </div>
          <div class="stat stat-depth">
            <span class="stat-label">Derinlik</span>
            <span class="stat-value" id="depth">0 m</span>
          </div>
        </div>
        <div id="toasts"></div>
        <div id="catch-banner" class="hidden"></div>
      </div>

      <!-- Yan panel: yukseltmeler -->
      <aside id="panel">
        <div id="panel-tabs">
          <button class="tab is-active" data-tab="upgrades">Yükseltmeler</button>
          <button class="tab" data-tab="log">Kayıt</button>
        </div>
        <div id="tab-upgrades" class="tab-body"></div>
        <div id="tab-log" class="tab-body hidden"></div>
      </aside>

      <button id="cast-btn" type="button">
        <span class="cast-icon">🎣</span>
        <span class="cast-label">OLTA AT</span>
      </button>

      <div id="offline" class="modal hidden">
        <div class="modal-card">
          <h2>Tekrar hoş geldin</h2>
          <p id="offline-text"></p>
          <button id="offline-ok" type="button">Devam</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
